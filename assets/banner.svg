<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-40px, -25px) scale(0.9); }
    }
    @keyframes pulseData {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.35; }
      50% { stroke-dashoffset: 40; opacity: 0.9; }
    }
    @keyframes pillPulse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .stream-line { stroke-dasharray: 8 6; animation: pulseData 4s linear infinite; }
    .pill-item-1 { animation: pillPulse 4s ease-in-out infinite; }
    .pill-item-2 { animation: pillPulse 4s ease-in-out infinite 0.7s; }
    .pill-item-3 { animation: pillPulse 4s ease-in-out infinite 1.4s; }
    .pill-item-4 { animation: pillPulse 4s ease-in-out infinite 2.1s; }
    .pill-item-5 { animation: pillPulse 4s ease-in-out infinite 2.8s; }
    .blink-node { animation: nodeBlink 3s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs -->
  <g filter="url(#glow)">
    <circle cx="200" cy="120" r="140" fill="#6366f1" fill-opacity="0.28" class="orb-1" />
    <circle cx="1020" cy="300" r="170" fill="#ec4899" fill-opacity="0.22" class="orb-2" />
    <circle cx="850" cy="90" r="120" fill="#06b6d4" fill-opacity="0.25" class="orb-1" />
    <circle cx="380" cy="360" r="130" fill="#a855f7" fill-opacity="0.2" class="orb-2" />
  </g>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Dynamic Animated Tech Circuit / Journey Flow Lines (Background) -->
  <g fill="none" opacity="0.6">
    <!-- Curved Marketing Funnel & Journey Flow -->
    <path d="M 60 360 C 250 360, 320 280, 520 280 S 780 340, 1140 340" stroke="#6366f1" stroke-width="2.5" class="stream-line" />
    <path d="M 60 80 C 300 80, 420 160, 680 160 S 950 90, 1140 90" stroke="#06b6d4" stroke-width="2" class="stream-line" style="animation-duration: 6s;" />
    <path d="M 120 220 C 380 220, 500 110, 800 110 S 1050 200, 1140 200" stroke="#ec4899" stroke-width="1.8" class="stream-line" style="animation-duration: 5s;" />

    <!-- Connection Nodes -->
    <circle cx="520" cy="280" r="5" fill="#a855f7" class="blink-node" />
    <circle cx="680" cy="160" r="4.5" fill="#06b6d4" class="blink-node" style="animation-delay: 1s;" />
    <circle cx="800" cy="110" r="4.5" fill="#ec4899" class="blink-node" style="animation-delay: 2s;" />
  </g>

  <!-- Foreground Content Container: Title, Subtitle, Badges & Interactive Graphic Elements -->
  
  <!-- Subtle Badge Pill on Top of Title -->
  <g transform="translate(600, 72)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1.2" />
    <circle cx="-150" cy="0" r="5" fill="#10b981" class="blink-node" />
    <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.8" text-anchor="middle">
      CURATED ECOSYSTEM • 2026 EDITION
    </text>
  </g>

  <!-- Primary Foreground Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="#ffffff" filter="url(#softGlow)">
    Awesome All-In-One Marketing Platform
  </text>
  <!-- Gradient Fill Pass for Title -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#primaryGrad)">
    Awesome All-In-One Marketing Platform
  </text>

  <!-- Subtitle in Solid High-Contrast Foreground -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
    SaaS Leaders, Open-Source Stacks, Marketing Automation &amp; Growth Pipelines
  </text>
  <text x="600" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
    Compare Pricing, Free Tiers, Market Cap/Valuations &amp; Self-Hosted Repositories
  </text>

  <!-- Interactive Feature Pills Row (Floating Dynamically without Obscuring Text) -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Automation -->
    <g class="pill-item-1" transform="translate(-460, 0)">
      <rect x="0" y="0" width="168" height="42" rx="21" fill="#1e1e38" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#6366f1" />
      <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff" text-anchor="middle">⚡ Automation</text>
    </g>

    <!-- Pill 2: Email & SMS -->
    <g class="pill-item-2" transform="translate(-270, 0)">
      <rect x="0" y="0" width="164" height="42" rx="21" fill="#0f2b38" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#06b6d4" />
      <text x="94" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#cffafe" text-anchor="middle">✉️ Email &amp; SMS</text>
    </g>

    <!-- Pill 3: CRM Pipelines -->
    <g class="pill-item-3" transform="translate(-85, 0)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="#2d1537" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#ec4899" />
      <text x="97" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fce7f3" text-anchor="middle">🎯 CRM Pipelines</text>
    </g>

    <!-- Pill 4: Sales Funnels -->
    <g class="pill-item-4" transform="translate(105, 0)">
      <rect x="0" y="0" width="168" height="42" rx="21" fill="#2b1a3e" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#a855f7" />
      <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f3e8ff" text-anchor="middle">📈 Sales Funnels</text>
    </g>

    <!-- Pill 5: Open-Source -->
    <g class="pill-item-5" transform="translate(293, 0)">
      <rect x="0" y="0" width="168" height="42" rx="21" fill="#132e27" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="21" r="7" fill="#10b981" />
      <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">🔓 100% Free OSS</text>
    </g>
  </g>

  <!-- Clean Border Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
</svg>
